.job_template: &matlab_job
    image: gitlab.mpi-magdeburg.mpg.de/ci-images/matlab-ci-images/matlab:${MATLAB_VERSION}
    stage: matlab
    needs: []
    script:
        - export OMP_NUM_THREADS=2
        - apt update; apt install --yes libhdf5-dev cmake libbz2-dev libblas64-dev liblapack64-dev
        - if [ -d build ]; then rm -rf build; fi
        -  mkdir -p build
        - cd build
        - cmake .. -DEXAMPLES=OFF -DMATLAB=ON -DINTEGER8=ON
        - make -j 4
        - cd matlab
        - ctest -V
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - if: $CI_COMMIT_BRANCH =~ /^branch-.*$/
        - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
          changes:
            - matlab/**/*

    artifacts:
        when: on_success
        paths:
            - build/mepack-*.tar.gz

octave:
    image: gitlab.mpi-magdeburg.mpg.de/ci-images/octave:${OCTAVE_VERSION}
    stage: octave
    needs: []
    script:
        - export OMP_NUM_THREADS=2
        - apt update; apt install --yes libhdf5-dev libbz2-dev
        - if [ -d build ]; then rm -rf build; fi
        - mkdir -p build
        - cd build
        - cmake .. -DMATLAB=ON -DEXAMPLES=OFF -DINTEGER8=OFF
        - make -j 4
        - cd matlab
        - ctest -V
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - if: $CI_COMMIT_BRANCH =~ /^branch-.*$/
        - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
          changes:
            - matlab/**/*
    artifacts:
        when: on_success
        paths:
            - build/mepack-*.tar.gz
    parallel:
        matrix:
          - OCTAVE_VERSION:
              - "10.3"
              - "10.2"
              - "10.1"
              - "9.4"
              - "9.3"
              - "9.2"
              - "9.1"
              - "8.4"
              - "8.3"
              - "8.2"
              - "8.1"
              - "7.3"
              - "7.2"
              - "7.1"
              - "6.4"
              - "6.3"
              - "6.2"
              - "6.1"
              - "5.2"
              - "5.1"
              - "4.4"

matlab:
  <<: *matlab_job
  parallel:
    matrix:
      - MATLAB_VERSION:
        - "2020b"
        - "2021a"
        - "2022a"
        - "2023b"
        - "2024b"
        - "2025a"


